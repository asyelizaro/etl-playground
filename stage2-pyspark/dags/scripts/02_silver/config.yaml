tables:
  # --- Hubs + Satellites ---
  - name: artist
    handler: loader.load_hub_sat
    depends_on: []
    source_table: artist
    database: silver
    business_key: artist_id
    columns:
      artist_id: artist_id
      name: name
    hub:
      target_table: artist_hub
      key_column: artist_hk
      load_dt_column: load_dt
      source_column: source
    sat:
      target_table: artist_sat
      attributes: [name]
      hash_diff_column: hash_diff
      load_dt_column: load_dt
      source_column: source

  - name: album
    handler: loader.load_hub_sat
    depends_on: []
    source_table: album
    database: silver
    business_key: album_id
    columns:
      album_id: album_id
      artist_id: artist_id
      title: title
    hub:
      target_table: album_hub
      key_column: album_hk
      load_dt_column: load_dt
      source_column: source
    sat:
      target_table: album_sat
      attributes: [title]
      hash_diff_column: hash_diff
      load_dt_column: load_dt
      source_column: source

  - name: track
    handler: loader.load_hub_sat
    depends_on: []
    source_table: track
    database: silver
    business_key: track_id
    columns:
      track_id: track_id
      name: name
      album_id: album_id
      media_type_id: media_type_id
      genre_id: genre_id
      composer: composer
      milliseconds: milliseconds
      bytes: bytes
      unit_price: unit_price
    hub:
      target_table: track_hub
      key_column: track_hk
      load_dt_column: load_dt
      source_column: source
    sat:
      target_table: track_sat
      attributes: [name, composer, milliseconds, bytes, unit_price]
      hash_diff_column: hash_diff
      load_dt_column: load_dt
      source_column: source

  - name: genre
    handler: loader.load_hub_sat
    depends_on: []
    source_table: genre
    database: silver
    business_key: genre_id
    columns:
      genre_id: genre_id
      name: name
    hub:
      target_table: genre_hub
      key_column: genre_hk
      load_dt_column: load_dt
      source_column: source
    sat:
      target_table: genre_sat
      attributes: [name]
      hash_diff_column: hash_diff
      load_dt_column: load_dt
      source_column: source

  - name: playlist
    handler: loader.load_hub_sat
    depends_on: []
    source_table: playlist
    database: silver
    business_key: playlist_id
    columns:
      playlist_id: playlist_id
