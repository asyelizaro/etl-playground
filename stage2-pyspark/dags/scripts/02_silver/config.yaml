    hub:
      target_table: invoice_hub
      key_column: invoice_hk
      load_dt_column: load_dt
      source_column: source
    sat:
      target_table: invoice_sat
      attributes:
        - invoice_date
        - billing_address
        - billing_city
        - billing_state
        - billing_country
        - billing_postal_code
        - total
      hash_diff_column: hash_diff
      load_dt_column: load_dt
      source_column: source

  # --- Links ---
  - name: artist_album_link
    handler: loader.load_link
    depends_on: [artist, album]
    source_table: album
    database: silver
    columns:
      artist_id: artist_id
      album_id: album_id
    link:
      target_table: artist_album_link
      key_column: artist_album_hk
      left_business_key: artist_id
      right_business_key: album_id
      left_key_column: artist_hk
      right_key_column: album_hk
      load_dt_column: load_dt
      source_column: source

  - name: album_track_link
    handler: loader.load_link
    depends_on: [album, track]
    source_table: track
    database: silver
    columns:
      album_id: album_id
      track_id: track_id
    link:
      target_table: album_track_link
      key_column: album_track_hk
      left_business_key: album_id
      right_business_key: track_id
      left_key_column: album_hk
      right_key_column: track_hk
      load_dt_column: load_dt
      source_column: source

  - name: genre_track_link
    handler: loader.load_link
    depends_on: [genre, track]
    source_table: track
    database: silver
    columns:
      genre_id: genre_id
      track_id: track_id
    link:
      target_table: genre_track_link
      key_column: genre_track_hk
      left_business_key: genre_id
      right_business_key: track_id
      left_key_column: genre_hk
