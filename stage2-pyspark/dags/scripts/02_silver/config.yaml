  - name: playlist_track_link
    handler: loader.load_link
    depends_on: [playlist, track]
    source_table: playlist_track
    database: silver
    columns:
      playlist_id: playlist_id
      track_id: track_id
    link:
      target_table: playlist_track_link
      key_column: playlist_track_hk
      left_business_key: playlist_id
      right_business_key: track_id
      left_key_column: playlist_hk
      right_key_column: track_hk
      load_dt_column: load_dt
      source_column: source

  - name: invoice_track_link
    handler: loader.load_link
    depends_on: [invoice, track]
    source_table: invoice_line
    database: silver
    columns:
      invoice_id: invoice_id
      track_id: track_id
    link:
      target_table: invoice_track_link
      key_column: invoice_track_hk
      left_business_key: invoice_id
      right_business_key: track_id
