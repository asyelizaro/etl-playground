      load_dt_column: load_dt
      source_column: source

  - name: employee
    handler: loader.load_hub_sat
    depends_on: []
    source_table: employee
    database: silver
    business_key: employee_id
    columns:
      employee_id: employee_id
      last_name: last_name
      first_name: first_name
      title: title
      reports_to: reports_to
      birth_date: birth_date
      hire_date: hire_date
      address: address
      city: city
      state: state
      country: country
      postal_code: postal_code
      phone: phone
      fax: fax
      email: email
    hub:
      target_table: employee_hub
      key_column: employee_hk
      load_dt_column: load_dt
      source_column: source
    sat:
      target_table: employee_sat
      attributes:
        - last_name
        - first_name
        - title
        - reports_to
        - birth_date
        - hire_date
        - address
        - city
        - state
        - country
        - postal_code
        - phone
