  - name: employee_customer_link
    handler: loader.load_link
    depends_on: [employee, customer]
    source_table: customer
    database: silver
    columns:
      employee_id: support_rep_id
      customer_id: customer_id
    link:
      target_table: employee_customer_link
      key_column: employee_customer_hk
      left_business_key: employee_id
      right_business_key: customer_id
      left_key_column: employee_hk
      right_key_column: customer_hk
      load_dt_column: load_dt
      source_column: source

  - name: customer_invoice_link
    handler: loader.load_link
    depends_on: [customer, invoice]
    source_table: invoice
    database: silver
    columns:
      customer_id: customer_id
      invoice_id: invoice_id
    link:
      target_table: customer_invoice_link
      key_column: customer_invoice_hk
      left_business_key: customer_id
      right_business_key: invoice_id
      left_key_column: customer_hk
