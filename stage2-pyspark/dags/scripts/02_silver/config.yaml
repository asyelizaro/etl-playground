  # --- Link Satellites ---
  - name: invoice_line_sat
    handler: loader.load_link_sat
    depends_on: [invoice_track_link]
    source_table: invoice_line
    database: silver
    columns:
      invoice_id: invoice_id
      track_id: track_id
      unit_price: unit_price
      quantity: quantity
    link:
      key_column: invoice_track_hk
      left_business_key: invoice_id
      right_business_key: track_id
      left_key_column: invoice_hk
      right_key_column: track_hk
    sat:
      target_table: invoice_line_sat
      attributes: [unit_price, quantity]
      hash_diff_column: hash_diff
      load_dt_column: load_dt
